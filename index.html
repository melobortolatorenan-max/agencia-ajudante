<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Agência · Promotor Ajudante</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <style>
    html, body { background:#000; color:#fff; }
    .card { background:#111827; border:1px solid #1f2937; border-radius:22px; }
    .card-app { background:#111827; border:1px solid #1f2937; border-radius:22px; }
    .btn { width:100%; padding:14px; border-radius:20px; background:#f59e0b; color:#000; font-weight:900; text-transform:uppercase; font-size:12px; letter-spacing:.04em; }
    .btn-line { width:100%; padding:14px; border-radius:20px; border:1px solid #f59e0b; color:#f59e0b; font-weight:900; text-transform:uppercase; font-size:12px; }
    .campo { width:100%; padding:14px; border-radius:18px; background:#111827; border:1px solid #1f2937; color:#fff; font-size:16px; outline:none; }
    .campo:focus { border-color:#f59e0b; }
  </style>
</head>
<body class="min-h-screen" style="padding-top:max(16px, env(safe-area-inset-top)); padding-bottom:max(16px, env(safe-area-inset-bottom))">
  <div class="max-w-md mx-auto px-4">
    <header id="topo" class="hidden flex items-center justify-between py-4">
      <div class="flex items-center gap-3">
        <img src="logo.png" alt="" class="w-10 h-10 rounded-full bg-black ring-1 ring-amber-500/40" onerror="this.remove()">
        <div>
          <div class="text-[10px] font-bold text-gray-500 uppercase tracking-[0.2em] leading-none" id="nome-agencia">Agência</div>
          <div class="text-2xl font-black text-amber-500 italic uppercase leading-none" id="titulo">Promotores</div>
        </div>
      </div>
      <button data-act="config" aria-label="Configurações" class="p-2 rounded-xl border border-gray-700 text-amber-500"><i data-lucide="settings" class="w-5 h-5"></i></button>
    </header>
    <div id="corpo" class="pb-10"></div>
  </div>
  <script src="firebase-config.js"></script>
  <script type="module" src="agencia.js"></script>
</body>
</html>
