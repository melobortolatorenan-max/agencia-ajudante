<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Agência · Promotor Ajudante</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <style>
    html, body { background:#000; color:#fff; }
    .card { background:#111827; border:1px solid #1f2937; border-radius:22px; }
    .card-app { background:#111827; border:1px solid #1f2937; border-radius:22px; }
    .btn { width:100%; padding:14px; border-radius:20px; background:#f59e0b; color:#000; font-weight:900; text-transform:uppercase; font-size:12px; letter-spacing:.04em; }
    .btn-line { width:100%; padding:14px; border-radius:20px; border:1px solid #f59e0b; color:#f59e0b; font-weight:900; text-transform:uppercase; font-size:12px; }
    .campo { width:100%; padding:14px; border-radius:18px; background:#111827; border:1px solid #1f2937; color:#fff; font-size:16px; outline:none; }
    .campo:focus { border-color:#f59e0b; }
    html.contraste .text-gray-500, html.contraste .text-gray-600 { color:#e5e7eb !important; }
    html.contraste .card, html.contraste .card-app { border-color:#9ca3af !important; }
    body.compacta .card, body.compacta .card-app { padding-top:.6rem !important; padding-bottom:.6rem !important; }
  </style>
</head>
<body class="min-h-screen" style="padding-top:max(16px, env(safe-area-inset-top)); padding-bottom:max(16px, env(safe-area-inset-bottom))">
<!-- ESCOLHA DE PERFIL (promotor ou agência) -->
<div id="escolha-perfil" class="hidden fixed inset-0 z-[300] bg-black flex-col items-center justify-center p-6">
  <div class="text-[10px] text-gray-500 font-black uppercase tracking-[0.3em] mb-2">Bem-vindo</div>
  <div class="text-2xl font-black italic uppercase text-amber-500 mb-2">Quem é você?</div>
  <p class="text-gray-400 text-sm text-center mb-8 max-w-xs">Escolha para abrir o aplicativo certo.</p>
  <button data-escolha="promotor" class="w-full max-w-sm py-5 rounded-2xl border border-amber-500 text-amber-500 font-black uppercase mb-3">Sou promotor</button>
  <button data-escolha="agencia" class="w-full max-w-sm py-5 rounded-2xl bg-amber-500 text-black font-black uppercase">Sou agência</button>
</div>

  <div class="max-w-md mx-auto px-4">
    <header id="topo" class="hidden relative py-4">
      <div class="flex items-center justify-center gap-3">
        <img src="logo.png" alt="" class="w-20 h-20" onerror="this.remove()">
        <div>
          <div class="text-xs font-bold text-gray-500 uppercase tracking-widest leading-none">Agência</div>
          <div class="text-4xl font-black text-amber-500 italic uppercase leading-none" id="titulo">Promotores</div>
        </div>
      </div>
      <button data-act="config" aria-label="Configurações" class="absolute right-0 top-1/2 -translate-y-1/2 p-2 rounded-xl border border-gray-700 text-amber-500"><i data-lucide="settings" class="w-5 h-5"></i></button>
    </header>
    <div id="corpo" class="pb-10"></div>
  </div>
  <script src="firebase-config.js"></script>
  <script type="module" src="agencia.js"></script>
</body>
</html>
